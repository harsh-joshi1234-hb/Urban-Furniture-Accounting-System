# ==============================================================================
# Render Blueprint (Infrastructure as Code)
# Automatically provisions:
# 1. Managed PostgreSQL Database
# 2. Node.js Express Backend Web Service
# ==============================================================================

databases:
  - name: urban-furniture-db
    databaseName: urban_furniture
    user: urban_admin
    plan: free
    region: oregon
    ipAllowList: [] # empty array allows all connections when external URL is used

services:
  - type: web
    name: urban-furniture-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && node prisma/seed.js
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: urban-furniture-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FRONTEND_URL
        value: https://urban-furniture-accounting.vercel.app,http://localhost:3000
      - key: APP_NAME
        value: Urban Furniture Accounting
      # Secrets to be provided in Render Dashboard (sync: false prevents overwriting)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
